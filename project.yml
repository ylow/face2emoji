name: Face2Emoji

options:
  deploymentTarget:
    macOS: "15.0"

packages:
  Face2EmojiCore:
    path: .

targets:
  Face2Emoji:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: Face2EmojiCore
        product: Face2EmojiCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.face2emoji
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_IDENTITY: "-"
        ENABLE_APP_SANDBOX: NO
        SWIFT_VERSION: "6.0"
